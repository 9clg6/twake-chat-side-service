name: Check

on:
  workflow_call:
    inputs:
      runner:
        description: The self-hosted runners for main and the tags; GitHub's for the pull requests, which forks open too
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit
      - run: npm run check
