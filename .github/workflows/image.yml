name: Image

on:
  workflow_call:
    inputs:
      push:
        description: Push to GHCR; otherwise build (and smoke test) only. The caller grants packages write.
        required: false
        type: boolean
        default: false
      version:
        description: Release version, pushed instead of latest
        required: false
        type: string
        default: ''
      runner:
        description: The self-hosted runners for main and the tags; GitHub's for the pull requests, which forks open too
        required: false
        type: string
        default: ubuntu-latest

jobs:
  image:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 30
    env:
      LOCAL_IMAGE: twake-chat-visio-side-service:ci
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ${{ env.LOCAL_IMAGE }}
          load: true
          cache-from: type=gha
          # Written from main and the releases only: a pull request cannot read another's
          cache-to: ${{ inputs.push && 'type=gha,mode=max' || '' }}

      - name: Smoke test
        run: docker/smoke-test.sh "$LOCAL_IMAGE"

      - name: Tags and labels
        if: inputs.push
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # latest follows main only: a release candidate or a tag on an older commit never moves it back
          tags: |
            type=raw,value=latest,enable=${{ inputs.version == '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: inputs.push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
